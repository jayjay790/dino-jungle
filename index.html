<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino Jungle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Jungle">
<meta name="theme-color" content="#2f6b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --leaf:#2f6b2a; --sun:#ffd23f; --sun-edge:#d99a0b; --ink:#3a2410;
  --panel:rgba(255,248,225,.94); --panel-ink:#3a2410;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --panel:rgba(28,44,24,.94); --panel-ink:#f6edd2; }
}
:root[data-theme="dark"]{ --panel:rgba(28,44,24,.94); --panel-ink:#f6edd2; }
html,body{height:100%;margin:0;}
body{background:var(--leaf);overflow:hidden;font-family:ui-rounded,'SF Pro Rounded','Trebuchet MS',system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}

#eggs{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));
  background:var(--panel);color:var(--panel-ink);font-weight:700;font-size:26px;padding:8px 18px;border-radius:999px;
  box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;gap:clamp(1px,.6vw,4px);
  font-size:clamp(14px,calc((100vw - 190px) / 12.5),26px);
  max-width:calc(100vw - 124px - env(safe-area-inset-left,0px) - env(safe-area-inset-right,0px));box-sizing:border-box;}
#eggs span{opacity:.22;filter:grayscale(1);transition:opacity .3s}
#eggs span.got{opacity:1;filter:none}
#eggs.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.3)}}

.btn{border:none;border-radius:22px;background:var(--sun);color:var(--ink);font-size:38px;font-family:inherit;font-weight:700;
  box-shadow:0 6px 0 var(--sun-edge);cursor:pointer;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-edge);}
.btn:focus-visible{outline:4px solid #fff;outline-offset:3px;}

#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,40,15,.45);}
#overlay[hidden]{display:none}
.card{background:var(--panel);color:var(--panel-ink);border-radius:32px;padding:28px 34px;text-align:center;max-width:min(88vw,440px);
  box-shadow:0 10px 0 rgba(0,0,0,.25);max-height:calc(100dvh - 24px);overflow-y:auto;touch-action:pan-y;}
.card h1{margin:0 0 6px;font-size:52px;line-height:1.05}
.card p{margin:0 0 20px;font-size:22px;line-height:1.35;font-weight:500}
.card .big{font-size:64px;line-height:1.1;margin:0 0 16px}
.card .big:empty{display:none}
.stickers{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 14px}
.stk{position:static;width:48px;height:46px;border-radius:12px;background:rgba(255,214,80,.35);display:block;transition:filter .4s,opacity .4s}
.stk.off{filter:grayscale(1);opacity:.3;background:rgba(0,0,0,.08)}
.species{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 16px}
.sp{width:84px;height:80px;border-radius:20px;border:4px solid transparent;background:rgba(116,195,76,.35);cursor:pointer;padding:0}
.sp canvas{position:static;width:100%;height:100%}
.sp.sel{border-color:var(--panel-ink);background:rgba(116,195,76,.7)}
.swatches{display:flex;gap:14px;justify-content:center;margin:0 0 20px}
.sw{width:58px;height:58px;border-radius:50%;border:5px solid transparent;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);padding:0}
.sw.sel{border-color:#fff;outline:4px solid var(--panel-ink);transform:scale(1.1)}
.modes{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 12px}
.mode-btn{padding:8px 20px;border-radius:20px;border:3px solid transparent;background:rgba(116,195,76,.35);cursor:pointer;font-size:19px;font-family:inherit;font-weight:700;color:var(--panel-ink);}
.mode-btn.sel{border-color:var(--panel-ink);background:rgba(116,195,76,.7)}
.maps{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 14px}
.mp{width:76px;height:64px;border-radius:16px;border:4px solid transparent;background:rgba(116,195,76,.35);cursor:pointer;padding:0;font-size:32px;display:flex;align-items:center;justify-content:center;}
.mp.sel{border-color:var(--panel-ink);background:rgba(116,195,76,.7)}
.card .btn{width:auto;height:auto;padding:10px 46px;font-size:56px;margin:0 auto}
#total-score{font-size:18px;font-weight:600;opacity:.55;margin:-10px 0 12px;}
@media (max-width:520px){
  #roar{width:110px;height:110px;font-size:54px}
}
@media (prefers-reduced-motion:reduce){#eggs.pop{animation:none}}
#menu-btn{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));
  width:72px;height:72px;border-radius:50%;font-size:36px;border:none;background:var(--panel);color:var(--panel-ink);
  box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;display:none;align-items:center;justify-content:center;
  touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
#menu-btn.vis{display:flex;}
#menu-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
#mute-btn{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));
  width:62px;height:62px;border-radius:50%;font-size:26px;border:none;background:var(--panel);color:var(--panel-ink);
  box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;display:none;align-items:center;justify-content:center;
  touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
#mute-btn.vis{display:flex;}
#mute-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="eggs" aria-label="Eggs found"></div>
<button id="menu-btn" aria-label="Menu">🏠</button>
<button id="mute-btn" aria-label="Mute">🔊</button>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Dino Jungle</h1>
    <div class="big" id="ovText"></div>
    <div id="total-score"></div>
    <div class="stickers" id="stickers" aria-label="Dinos met"></div>
    <div class="modes" id="modes"><button class="mode-btn sel" data-mode="eggs">🥚 Eggs</button><button class="mode-btn" data-mode="parade">🎺 Parade</button><button class="mode-btn" data-mode="hide">🙈 Hide</button></div>
    <div class="maps" id="maps" aria-label="Pick a map"></div>
    <div class="species" id="species" aria-label="Pick a dinosaur"></div>
    <div class="swatches" id="swatches" aria-label="Dino colour"></div>
    <button class="btn" id="ovBtn" aria-label="Play">▶</button>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('game'); let ctx = cv.getContext('2d');
let VW, VH, Z;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = VW * dpr; cv.height = VH * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  Z = Math.max(0.6, Math.min(1.3, Math.min(VW, VH) / 650));
  cv._dpr = dpr;
}
addEventListener('resize', resize); resize();

// ---------- world ----------
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const W = 4800, H = 3600, START = {x:2000, y:1500}, EGG_COUNT = 10;
const ponds = [
  {x:950, y:1550,rx:240,ry:150},{x:2350,y:1750,rx:290,ry:175},{x:2550,y:550,rx:180,ry:115},
  {x:520, y:2050,rx:150,ry:95}, {x:1750,y:480, rx:140,ry:90},
  {x:3800,y:700, rx:200,ry:125},{x:4300,y:2000,rx:260,ry:165},
  {x:3500,y:3200,rx:200,ry:125},{x:1000,y:3000,rx:230,ry:145},{x:700,y:3400,rx:165,ry:105},
];
const volcanoes = [
  {type:'volcano', x:650,  y:760,  r:165},
  {type:'volcano', x:2900, y:320,  r:150},
  {type:'volcano', x:200,  y:1850, r:155},
  {type:'volcano', x:2750, y:1820, r:160},
  {type:'volcano', x:4300, y:1100, r:155},
  {type:'volcano', x:1500, y:3300, r:150},
];
const inWater = (x,y,m) => ponds.some(p => { const dx=(x-p.x)/(p.rx+m), dy=(y-p.y)/(p.ry+m); return dx*dx+dy*dy < 1; });

const trees=[], rocks=[], bushes=[], solids=volcanoes.map(v => ({x:v.x, y:v.y-30, r:v.r}));
const free = (x,y,m) => !inWater(x,y,m) && Math.hypot(x-START.x,y-START.y) > 150 && solids.every(o => Math.hypot(x-o.x,y-o.y) > o.r + m);
const addTree = (x,y) => { const t={type:'tree',x,y,r:24,s:0.85+rnd()*0.45,h:rnd()}; trees.push(t); solids.push(t); };
for (let x=0; x<=W; x+=75){ addTree(x+rnd()*25, 15+rnd()*15); addTree(x+rnd()*25, H-15-rnd()*15); }
for (let y=80; y<=H-80; y+=75){ addTree(15+rnd()*15, y+rnd()*25); addTree(W-15-rnd()*15, y+rnd()*25); }
for (let i=0;i<270;i++){ const x=80+rnd()*(W-160), y=80+rnd()*(H-160); if (free(x,y,45)) addTree(x,y); }
for (let i=0;i<70;i++){ const x=80+rnd()*(W-160), y=80+rnd()*(H-160); if (free(x,y,30)){ const r={type:'rock',x,y,r:16+rnd()*12,h:rnd()}; rocks.push(r); solids.push(r);} }
for (let i=0;i<230;i++){ const x=60+rnd()*(W-120), y=60+rnd()*(H-120); if(!inWater(x,y,20)) bushes.push({type:'bush',x,y,s:0.7+rnd()*0.6,h:rnd()}); }

let eggs = [];
function placeEggs(){
  eggs=[];
  const ePN=Math.ceil(EGG_COUNT/NESTS.length);
  NESTS.forEach((nest,ni)=>{
    let placed=0,tries=0;
    while(placed<ePN&&eggs.length<EGG_COUNT&&tries++<2000){
      const a=Math.random()*Math.PI*2,d=50+Math.random()*130;
      const x=nest.x+Math.cos(a)*d, y=nest.y+Math.sin(a)*d;
      if(free(x,y,25)&&eggs.every(e=>Math.hypot(e.x-x,e.y-y)>55)){
        eggs.push({type:'egg',x,y,nestId:ni,c:['#ff9ecb','#8fd3ff','#ffd56b','#c7a0ff'][eggs.length%4],w:Math.random()*6});
        placed++;
      }
    }
  });
}

// ---------- map themes ----------
const MAPS = {
  jungle:{label:'Jungle',icon:'🌴',
    bg:'#1f5a22',groundFill:'#74c34c',blobA:'rgba(40,110,30,.10)',blobB:'rgba(200,240,120,.10)',
    trail:'rgba(196,150,90,.55)',clearing:'rgba(196,150,90,.55)',grassColor:'#4f9a33',
    flowerColors:['#fff','#ffe14d','#ff7eb6','#b78bff','#ff8a4d'],
    pondSand:'#e3c98d',pondWaterA:'#5cc8e8',pondWaterB:'#2e8fc0',lilyColor:'#4caf50',lilyFlower:'#ffc2dd',
    trunkColor:'#7a4e2a',leafA:['#1f6b2a','#2e8a35','#45a845'],leafB:['#22702f','#378f2e','#5bb53b'],fruitColor:'#ff5a4e',
    rockA:'#8c8f94',rockB:'#b3b6bb',bushA:'#3c9a3a',bushB:'#2f8a43',bushTop:'#52b04a',bushTopB:'#45a656',
    foods:['🍎','🍌','🍇','🥥','🍓','🍉']},
  ice:{label:'Ice Kingdom',icon:'❄️',
    bg:'#0d1f38',groundFill:'#c8dff0',blobA:'rgba(180,210,240,.15)',blobB:'rgba(255,255,255,.12)',
    trail:'rgba(150,190,230,.65)',clearing:'rgba(150,190,230,.55)',grassColor:'#8ab8d8',
    flowerColors:['#fff','#c8e8ff','#a8d8f8','#e0f0ff'],
    pondSand:'#a8c8e8',pondWaterA:'#eaf6ff',pondWaterB:'#b8d8f0',lilyColor:'#c0e8ff',lilyFlower:'#ffffff',
    trunkColor:'#4a6888',leafA:['#c8e4f8','#d8ecff','#e8f4ff'],leafB:['#b8daf4','#c8e4ff','#daeeff'],fruitColor:'#a8d0f8',
    rockA:'#7898b8',rockB:'#a8c8e0',bushA:'#b0d4f0',bushB:'#98c4e8',bushTop:'#c8e0f8',bushTopB:'#d8ecff',
    foods:['🐟','🫐','🍦','⭐','🪨','🧊']},
  candy:{label:'Candy Land',icon:'🍭',
    bg:'#2a0840',groundFill:'#f4c8f0',blobA:'rgba(255,140,220,.12)',blobB:'rgba(255,240,160,.10)',
    trail:'rgba(255,200,80,.6)',clearing:'rgba(255,200,80,.55)',grassColor:'#e060c0',
    flowerColors:['#ff80c0','#ff4488','#ffe060','#80ffff','#c080ff','#fff'],
    pondSand:'#ffb8e8',pondWaterA:'#ff80cc',pondWaterB:'#ee40a8',lilyColor:'#ff60b0',lilyFlower:'#ffffff',
    trunkColor:'#e84080',leafA:['#ff90d0','#ff60b8','#ff40a0'],leafB:['#c060e8','#a040cc','#d080f8'],fruitColor:'#ffee40',
    rockA:'#c080e8',rockB:'#d8a8f8',bushA:'#ff80c0',bushB:'#e860a8',bushTop:'#ff90cc',bushTopB:'#ee70b8',
    foods:['🍭','🍬','🍰','🧁','🍩','🍫']},
  desert:{label:'Desert',icon:'🏜️',
    bg:'#7a3a0a',groundFill:'#e8c870',blobA:'rgba(200,150,60,.15)',blobB:'rgba(255,210,100,.10)',
    trail:'rgba(160,100,40,.6)',clearing:'rgba(160,100,40,.55)',grassColor:'#b8903a',
    flowerColors:['#ff6b35','#ff4040','#ffaa00','#ff8c00','#ffe060'],
    pondSand:'#c8a050',pondWaterA:'#6ab8d0',pondWaterB:'#3a7090',lilyColor:'#90c860',lilyFlower:'#ffee44',
    trunkColor:'#5a3010',leafA:['#3a7020','#2e6015','#4a8a25'],leafB:['#507a20','#3e6815','#5e9228'],fruitColor:'#ff5500',
    rockA:'#c8a040',rockB:'#dfc060',bushA:'#6a8028',bushB:'#568022',bushTop:'#78a030',bushTopB:'#649228',
    foods:['🌵','🍊','🍯','🥜','🫐','🍇']},
  moon:{label:'Moon',icon:'🌙',
    bg:'#05051a',groundFill:'#c3c6d4',blobA:'rgba(70,70,110,.10)',blobB:'rgba(255,255,255,.10)',
    trail:'rgba(110,110,150,.35)',clearing:'rgba(110,110,150,.35)',grassColor:'#9aa0bc',
    flowerColors:['#8fe3ff','#c79bff','#ff9be0','#fff7a8'],
    pondSand:'#a4a8bc',pondWaterA:'#c4f6ff',pondWaterB:'#5a6cff',lilyColor:'#8fe3ff',lilyFlower:'#ffffff',
    trunkColor:'#6b6f8a',leafA:['#8fe3ff','#c79bff','#ff9be0'],leafB:['#c79bff','#8fe3ff','#fff7a8'],fruitColor:'#fff7a8',
    rockA:'#8a8ea6',rockB:'#aeb2c6',bushA:'#7a5cc8',bushB:'#3fa3b8',bushTop:'#9b7fe6',bushTopB:'#5cc6da',
    foods:['🧀','⭐','🍪','🫐','🌟','🍩']},
};
let mapName = 'jungle';
try { const sm=localStorage.getItem('dinoMap'); if(MAPS[sm]) mapName=sm; } catch(e){}

// ---------- pre-rendered ground ----------
const ground = document.createElement('canvas');
function buildGround(){
  // half resolution: keeps the canvas well under iOS Safari's size/memory limits
  const M=MAPS[mapName]; ground.width=W/2; ground.height=H/2;
  const g=ground.getContext('2d'); g.setTransform(.5,0,0,.5,0,0);
  g.fillStyle=M.groundFill; g.fillRect(0,0,W,H);
  for (let i=0;i<800;i++){ g.fillStyle=Math.random()<.5?M.blobA:M.blobB;
    g.beginPath(); g.arc(Math.random()*W,Math.random()*H,40+Math.random()*110,0,7); g.fill(); }
  // dappled sunlight and soft shade patches
  for (let i=0;i<260;i++){ const x=Math.random()*W,y=Math.random()*H,r=70+Math.random()*170,lit=Math.random()<.6;
    const gr=g.createRadialGradient(x,y,0,x,y,r); gr.addColorStop(0,lit?'rgba(255,250,200,.13)':'rgba(0,30,0,.09)'); gr.addColorStop(1,'rgba(0,0,0,0)');
    g.fillStyle=gr; g.fillRect(x-r,y-r,r*2,r*2); }
  // trails: soft dark edge, the path, then a worn lighter middle with a few stones
  const trails=[[1100,1900],[2900,2000],[3500,800],[700,2500],[1000,1000],
   [2000,3000],[2400,700],[3900,1600],[300,1500],
   [4500,1000],[4600,2600],[4400,3400],[3200,3500],[1200,3400],[500,3100]].map(([tx,ty]) =>
    [(START.x+tx)/2+(Math.random()-.5)*400,(START.y+ty)/2+(Math.random()-.5)*400,tx,ty]);
  g.lineCap='round';
  [['rgba(0,0,0,.07)',60],[M.trail,46],['rgba(255,255,255,.09)',18]].forEach(([c,w]) => { g.strokeStyle=c; g.lineWidth=w;
    trails.forEach(([cx,cy,tx,ty]) => { g.beginPath(); g.moveTo(START.x,START.y); g.quadraticCurveTo(cx,cy,tx,ty); g.stroke(); }); });
  trails.forEach(([cx,cy,tx,ty]) => { for (let k=0;k<40;k++){ const u=Math.random(), v=1-u, side=(Math.random()-.5)*44;
    const x=v*v*START.x+2*v*u*cx+u*u*tx, y=v*v*START.y+2*v*u*cy+u*u*ty+side*.6;
    g.fillStyle='rgba(90,70,50,.28)'; g.beginPath(); g.ellipse(x+side,y,3+Math.random()*4,2+Math.random()*2,Math.random(),0,7); g.fill(); } });
  g.fillStyle=M.clearing; g.beginPath(); g.ellipse(START.x,START.y,120,85,0,0,7); g.fill();
  // pebbles
  for (let i=0;i<500;i++){ const x=Math.random()*W,y=Math.random()*H,r=3+Math.random()*5; if(inWater(x,y,20)) continue;
    g.fillStyle='rgba(0,0,0,.12)'; g.beginPath(); g.ellipse(x+1,y+1.5,r,r*.65,0,0,7); g.fill();
    g.fillStyle=Math.random()<.5?M.rockA:M.rockB; g.beginPath(); g.ellipse(x,y,r,r*.65,0,0,7); g.fill();
    g.fillStyle='rgba(255,255,255,.3)'; g.beginPath(); g.ellipse(x-r*.3,y-r*.25,r*.35,r*.2,0,0,7); g.fill(); }
  const moon = mapName==='moon';
  // moon craters: dark bowl, lit far rim, soft floor
  if (moon) for (let i=0;i<170;i++){ const x=Math.random()*W,y=Math.random()*H,r=18+Math.random()*Math.random()*110;
    if (inWater(x,y,r+20) || Math.hypot(x-START.x,y-START.y)<r+140) continue;
    g.fillStyle='rgba(255,255,255,.5)'; g.beginPath(); g.ellipse(x+r*.08,y+r*.08,r*1.1,r*.76,0,0,7); g.fill();
    g.fillStyle='rgba(40,40,80,.32)'; g.beginPath(); g.ellipse(x,y,r,r*.68,0,0,7); g.fill();
    g.fillStyle='rgba(40,40,80,.12)'; g.beginPath(); g.ellipse(x-r*.1,y-r*.08,r*.8,r*.5,0,0,7); g.fill();
    g.fillStyle='rgba(255,255,255,.12)'; g.beginPath(); g.ellipse(x+r*.25,y+r*.2,r*.45,r*.25,0,0,7); g.fill(); }
  // two-tone grass tufts: dark blades, then sunlit tips on some
  g.strokeStyle=M.grassColor; g.lineWidth=2.5;
  if (!moon) for (let i=0;i<5300;i++){ const x=Math.random()*W,y=Math.random()*H; g.beginPath();
    g.moveTo(x-4,y); g.lineTo(x-6,y-9); g.moveTo(x,y); g.lineTo(x,y-11); g.moveTo(x+4,y); g.lineTo(x+6,y-9); g.stroke(); }
  g.strokeStyle='rgba(255,255,210,.22)'; g.lineWidth=2;
  if (!moon) for (let i=0;i<2600;i++){ const x=Math.random()*W,y=Math.random()*H; g.beginPath();
    g.moveTo(x-3,y); g.lineTo(x-5,y-12); g.moveTo(x+1,y); g.lineTo(x+2,y-14); g.moveTo(x+5,y); g.lineTo(x+8,y-10); g.stroke(); }
  const fc=M.flowerColors;
  for (let i=0;i<620;i++){ const x=Math.random()*W,y=Math.random()*H; if(inWater(x,y,25)) continue;
    g.fillStyle=fc[(Math.random()*fc.length)|0];

// Roar = growling voice (rough sawtooth with pitch rise-and-fall) + breathy throat noise,
// shaped through mouth-like formant filters, lightly distorted, with a jungle echo.
let fx = null, lastRoar = 0;
function roarFX(a){
  if (fx) return fx;
  const out = a.createGain(); out.gain.value = .8; out.connect(a.destination);
  const comp = a.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 6; comp.connect(out);
  const len = a.sampleRate * 2.2, ir = a.createBuffer(2, len, a.sampleRate);
  for (let c=0;c<2;c++){ const d=ir.getChannelData(c); for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
  const verb = a.createConvolver(); verb.buffer = ir;
  const wet = a.createGain(); wet.gain.value = .35; verb.connect(wet); wet.connect(comp);
  const n = 1024, curve = new Float32Array(n);
  for (let i=0;i<n;i++){ const x=i/(n-1)*2-1; curve[i]=Math.tanh(x*3.5); }
  const shaper = a.createWaveShaper(); shaper.curve = curve; shaper.oversample = '4x';
  const bus = a.createGain(); bus.connect(shaper); shaper.connect(comp); shaper.connect(verb);
  const noise = a.createBuffer(1, a.sampleRate*2, a.sampleRate), nd = noise.getChannelData(0);
  for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
  return fx = {bus, noise};
}

  playRoar(SPECIES[speciesName].pitch, 1);
  const et=a.currentTime+.28;
  if(speciesName==='unicorn'){ [880,1100,1320].forEach((f,i)=>{ const ti=et+i*.1,o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.13,ti); g.gain.exponentialRampToValueAtTime(.001,ti+.35); o.connect(g); g.connect(a.destination); o.start(ti); o.stop(ti+.4); }); }
  if(speciesName==='ptero'){ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.setValueAtTime(1900,et); o.frequency.linearRampToValueAtTime(650,et+.55); g.gain.setValueAtTime(.18,et); g.gain.exponentialRampToValueAtTime(.001,et+.65); o.connect(g); g.connect(a.destination); o.start(et); o.stop(et+.7); }
  if(speciesName==='brachi'){ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(32,et); o.frequency.exponentialRampToValueAtTime(18,et+.9); g.gain.setValueAtTime(.22,et); g.gain.exponentialRampToValueAtTime(.001,et+1.3); o.connect(g); g.connect(a.destination); o.start(et); o.stop(et+1.4); }
  if(speciesName==='anky'){ const o=a.createOscillator(),g=a.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(55,et); o.frequency.exponentialRampToValueAtTime(28,et+.6); g.gain.setValueAtTime(.18,et); g.gain.exponentialRampToValueAtTime(.001,et+.9); o.connect(g); g.connect(a.destination); o.start(et); o.stop(et+1); }

}
function playRoar(pitch, vol){
  if(muted) return; const a = audio(); if (!a) return;
  const {bus, noise} = roarFX(a);
  const t = a.currentTime + .01, D = 1.5, p = (.85 + Math.random()*.3) * pitch;   // every roar slightly different
  const nodes = [];
  const env = a.createGain();
  env.gain.setValueAtTime(.0001,t); env.gain.exponentialRampToValueAtTime(.9*vol,t+.18);
  env.gain.setValueAtTime(.9*vol,t+.7); env.gain.exponentialRampToValueAtTime(.0001,t+D);
  env.connect(bus);
  // mouth shape: opens wide ("aaah") then closes ("ooww")
  const filt = (type,q,fs,g) => { const f=a.createBiquadFilter(); f.type=type; f.Q.value=q;
    f.frequency.setValueAtTime(fs[0]*p,t); f.frequency.linearRampToValueAtTime(fs[1]*p,t+.35); f.frequency.linearRampToValueAtTime(fs[2]*p,t+D);
    const gn=a.createGain(); gn.gain.value=g; f.connect(gn); gn.connect(env); return f; };
  const throat = a.createGain();
  throat.connect(filt('bandpass',3,[450,750,380],.9));
  throat.connect(filt('bandpass',4,[1100,1300,700],.5));
  throat.connect(filt('lowpass',.7,[260,300,200],1.1));
  // rough, rattly voice: the volume flutters ~25 times a second
  const rough = a.createGain(); rough.gain.value = .6; rough.connect(throat);
  const flutter = a.createOscillator(); flutter.type='square';
  flutter.frequency.setValueAtTime(22,t); flutter.frequency.linearRampToValueAtTime(32,t+.4); flutter.frequency.linearRampToValueAtTime(18,t+D);
  const fg = a.createGain(); fg.gain.value = .4; flutter.connect(fg); fg.connect(rough.gain); nodes.push(flutter);
  const wobble = a.createOscillator(); wobble.frequency.value = 6;
  const wg = a.createGain(); wg.gain.value = 35; wobble.connect(wg); nodes.push(wobble);
  [[1,'sawtooth',.5],[1.013,'sawtooth',.4],[.5,'sine',.8]].forEach(([m,type,g]) => {
    const o=a.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(70*p*m,t); o.frequency.exponentialRampToValueAtTime(130*p*m,t+.3);
    o.frequency.exponentialRampToValueAtTime(95*p*m,t+.8); o.frequency.exponentialRampToValueAtTime(45*p*m,t+D);

  const bg = a.createGain(); bg.gain.value = .55; br.connect(bg); bg.connect(throat); nodes.push(br);

}
function chime(){

    o.type='triangle'; o.frequency.value=f; gn.gain.setValueAtTime(.25,t); gn.gain.exponentialRampToValueAtTime(.0001,t+.35);
    o.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t+.4); });

function tone(type,f0,f1,dur,vol,delay=0){
  if(muted) return; const a=audio(); if(!a) return;
  const t=a.currentTime+delay, o=a.createOscillator(), g=a.createGain(); o.type=type;
  o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(f1,t+dur);

}

let sayUntil=0, voice=null;
function pickVoice(){
  try { const vs=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang));
    return vs.find(v=>v.localService&&/Samantha|Karen|Moira|Tessa|Serena|Fiona/.test(v.name)) || vs.find(v=>v.localService) || vs[0] || null; }
  catch(e){ return null; }

// important words interrupt; the rest are skipped if the voice is still talking
function say(text, important){
  if(muted || !('speechSynthesis' in window) || !window.SpeechSynthesisUtterance) return;
  const now=performance.now(); if(!important && now<sayUntil) return;
  try { if(important) speechSynthesis.cancel();
    const u=new SpeechSynthesisUtterance(text); u.rate=.9; u.pitch=1.3;
    voice=voice||pickVoice(); if(voice){ u.voice=voice; u.lang=voice.lang; }
    speechSynthesis.speak(u); sayUntil=now+700+text.length*70; } catch(e){}
}

// every dino is painted into a reusable scratch canvas first, so the whole body can get
// soft top lighting and a cartoon outline in one pass. DB = local drawing box around the feet.
const DB = {x:-108, y:-172, w:204, h:202}, DRMAX = 3.5;
const dBody = document.createElement('canvas'), dLine = document.createElement('canvas');
dBody.width = dLine.width = Math.ceil(DB.w*DRMAX); dBody.height = dLine.height = Math.ceil(DB.h*DRMAX);

let pxScale = 2; // screen pixels per world unit; set before drawing
function drawDino(d,t){
  const kind = d.kind || speciesName;
  const bob = d.moving ? Math.abs(Math.sin(d.walk))*(mapName==='moon'&&!d.preview?16:3) : Math.sin(t*2)*1;
  const leg = d.moving ? Math.sin(d.walk) : 0;
  const wag = Math.sin(t*(d.moving?10:3))*4;
  const sc = 1 + d.roar*.18;
  const z = d.s || 1;
  if (d === dino){
    const cel = dino.celebrate > 0;
    ctx.strokeStyle = cel ? `rgba(255,220,50,${.8+Math.sin(t*15)*.2})` : 'rgba(255,236,120,.9)';
    ctx.lineWidth = cel ? 7 : 4;

  const celebSc = (d===dino && dino.celebrate>0) ? 1+Math.abs(Math.sin(t*10))*dino.celebrate*.06 : 1;
  const k = sc*z*celebSc, R = Math.max(.6, Math.min(DRMAX, pxScale*k)), pw = Math.ceil(DB.w*R), ph = Math.ceil(DB.h*R);
  // paint the body on the scratch canvas, then shade it top-to-bottom
  const main = ctx; ctx = dbx;
  try {
    dbx.setTransform(1,0,0,1,0,0); dbx.clearRect(0,0,pw,ph);
    dbx.setTransform(R,0,0,R,-DB.x*R,-DB.y*R); dbx.lineCap='round';

    gr.addColorStop(0,'rgba(255,255,225,.24)'); gr.addColorStop(.45,'rgba(255,255,255,0)'); gr.addColorStop(1,'rgba(30,10,50,.24)');

  ctx.restore();

  if(!d.preview && kind!=='ptero' && inWater(d.x,d.y,0)){
    ctx.globalAlpha=.8; ell(d.x, d.y+1, (kind==='rex'?36:46)*z, 10*z, MAPS[mapName].pondWaterB); ctx.globalAlpha=1;
    ctx.strokeStyle='rgba(255,255,255,.6)'; ctx.lineWidth=2; ctx.beginPath(); ctx.ellipse(d.x,d.y+1,(kind==='rex'?36:46)*z,10*z,0,Math.PI,Math.PI*2); ctx.stroke(); }
  }

  flies.forEach(f => { f.a += dt*(.6+Math.sin(t+f.x)*.4); f.x += Math.cos(f.a)*40*dt; f.y += Math.sin(f.a*1.3)*30*dt;
    f.x=(f.x+W)%W; f.y=(f.y+H)%H; });
  for (let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; const fl=s.heart||s.star; s.vy+=(s.puff?0:fl?-30:mapName==='moon'?130:500)*dt; s.life-=dt*(fl?.8:1.4); if (s.life<=0) sparks.splice(i,1); }
  volcanoes.forEach(v=>{ if(v.erupting>0) v.erupting=Math.max(0,v.erupting-dt); });
  updateAmbients(dt,t);

  // camera
  const Zf=Z*(1-zoomPulse*.28); Zcam=Zf;
  const shX=shakeTimer>0?(Math.random()-.5)*shakeAmt:0, shY=shakeTimer>0?(Math.random()-.5)*shakeAmt*.5:0;
  const vw=VW/Zf, vh=VH/Zf;
  camX = vw>=W ? (W-vw)/2 : Math.max(0,Math.min(W-vw, dino.x-vw/2));
  camY = vh>=H ? (H-vh)/2 : Math.max(0,Math.min(H-vh, dino.y-50-vh/2));
  const dpr = cv._dpr; pxScale = dpr*Zf;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle=MAPS[mapName].bg; ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(dpr*Zf,0,0,dpr*Zf,(-camX+shX)*dpr*Zf,(-camY+shY)*dpr*Zf);
  ctx.drawImage(ground,0,0,W,H);

  // water shimmer
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
  ponds.forEach((p,i) => { for (let k=0;k<3;k++){ const ph=(t*.5+k/3+i*.2)%1; ctx.globalAlpha=1-ph;
    ctx.beginPath(); ctx.ellipse(p.x+Math.cos(i+k)*p.rx*.3, p.y+Math.sin(i*2+k)*p.ry*.3, 10+ph*30, 4+ph*12, 0,0,7); ctx.stroke(); } });
  ctx.globalAlpha=1;

  // nest markers
  if(playMode==='eggs') NESTS.forEach((n,i)=>{ const hasEggs=eggs.some(e=>e.nestId===i); ctx.strokeStyle=hasEggs?'rgba(255,220,80,.5)':'rgba(255,220,80,.18)'; ctx.lineWidth=3; ctx.setLineDash([10,8]); ctx.beginPath(); ctx.ellipse(n.x,n.y,95,65,0,0,7); ctx.stroke(); ctx.setLineDash([]); });
  // depth-sorted objects in view
  const pad=140, vis = o => o.x>camX-pad && o.x<camX+vw+pad && o.y>camY-pad && o.y<camY+vh+pad*1.5;
  ripples.forEach(r=>{ ctx.globalAlpha=1-r.t; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=2.5; ctx.beginPath(); ctx.ellipse(r.x,r.y,12+r.t*55,5+r.t*22,0,0,7); ctx.stroke(); }); ctx.globalAlpha=1;
  drawCritters(t, true);
  const list = [...trees,...rocks,...bushes,...eggs,...hatches,...foods,...npcs,...volcanoes,...hatchlings,...(hider?[hider]:[]),playerBaby,dino].filter(o => o.type==='volcano' ? Math.abs(o.x-camX-vw/2) < vw/2+260 && o.y>camY-60 && o.y<camY+vh+320 : vis(o)).sort((a,b)=>a.y-b.y);
  for (const o of list){
    if (o.type==='tree') drawTree(o,t); else if (o.type==='rock') drawRock(o,t);
    else if (o.type==='bush') drawBush(o,t); else if (o.type==='egg') drawEgg(o,t); else if (o.type==='hatch') drawHatch(o); else if (o.type==='food') drawFood(o,t); else if (o.type==='volcano') drawVolcano(o,t); else drawDino(o,t);
  }
  if (target){ const r=14+Math.sin(t*8)*4; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(target.x,target.y,r,r*.5,0,0,7); ctx.stroke(); }
  drawRoarText(dino);
  sparks.forEach(s => { ctx.globalAlpha=Math.min(1,s.life);
    if (s.heart){ ctx.font='28px sans-serif'; ctx.textAlign='center'; ctx.fillText('💛',s.x,s.y); }
    else if (s.star){ ctx.font='30px sans-serif'; ctx.textAlign='center'; ctx.fillText('⭐',s.x,s.y); }
    else if (s.puff){ ctx.globalAlpha=s.life*.9; const r=5+(.6-s.life)*22; ell(s.x,s.y,r,r*.7,MAPS[mapName].pondSand); }
    else { ell(s.x,s.y,4,4,s.c); ell(s.x-1.2,s.y-1.2,1.5,1.5,'rgba(255,255,255,.7)'); } }); ctx.globalAlpha=1;
  drawCritters(t, false);
  flies.filter(vis).forEach(f => drawFly(f,t));
  npcs.filter(n=>n.sleepTimer>10&&vis(n)).forEach(n=>{
    const yb=n.y-SPECIES[n.kind].top*n.s-8;
    ['z','Z'].forEach((z,i)=>{ const bob=Math.abs(Math.sin(t*.9+i))*.6+.3;
      ctx.save(); ctx.globalAlpha=bob; ctx.font=`bold ${Math.round((13+i*5)*n.s)}px ui-rounded,system-ui`; ctx.textAlign='center';
      ctx.fillStyle='#aaddff'; ctx.fillText(z,n.x+(9+i*11)*n.s,yb-i*14*n.s-Math.sin(t*.7+i)*5); ctx.restore(); ctx.globalAlpha=1; }); });
  npcs.filter(n=>n.nameTimer>0&&vis(n)).forEach(n=>{
    const al=Math.min(1,n.nameTimer), yy=n.y-SPECIES[n.kind].top*n.s-16;
    ctx.save(); ctx.globalAlpha=al; ctx.font=`bold ${Math.round(16*n.s)}px ui-rounded,system-ui`; ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.fillStyle='#fff';
    ctx.strokeText(SPECIES[n.kind].label,n.x,yy); ctx.fillText(SPECIES[n.kind].label,n.x,yy); ctx.restore(); ctx.globalAlpha=1; });

  // hint arrow to the nearest egg, or to the hiding dino if it's taking a while
  let n=null, nd=1e9;
  if (playing && eggs.length) eggs.forEach(e => { const dd=Math.hypot(e.x-dino.x,e.y-dino.y); if (dd<nd){nd=dd;n=e;} });
  else if (playing && hider && !(hider.found>0) && hider.timer>12){ n=hider; nd=Math.hypot(n.x-dino.x,n.y-dino.y); }
  if (n){
    if (nd > 260){ const a=Math.atan2(n.y-dino.y, n.x-dino.x), ax=dino.x+Math.cos(a)*80, ay=dino.y-35+Math.sin(a)*80;
      ctx.save(); ctx.translate(ax,ay); ctx.rotate(a); ctx.globalAlpha=.55+Math.sin(t*5)*.25;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-8,-11); ctx.lineTo(-3,0); ctx.lineTo(-8,11); ctx.closePath(); ctx.fill(); ctx.restore(); }
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawAmbients(t);
  ctx.drawImage(vignette,0,0,VW,VH);
}
// never let one bad frame stop the game; show the first error small in a corner for the grown-ups
let errShown=false;
function frame(now){
  try { step(now); }
  catch(err){
    ctx.setTransform(1,0,0,1,0,0); ctx.globalAlpha=1; try{ ctx.setLineDash([]); }catch(_){}
    if(!errShown){ errShown=true; const d=document.createElement('div');
      d.style.cssText='position:fixed;left:8px;bottom:8px;max-width:70vw;font:11px monospace;background:rgba(0,0,0,.7);color:#fff;padding:6px;border-radius:6px;z-index:9;pointer-events:none';
      d.textContent=String((err&&err.stack)||err).slice(0,300); document.body.appendChild(d); setTimeout(()=>d.remove(),8000); }
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
