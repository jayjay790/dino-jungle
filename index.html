<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dino Jungle</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino Jungle">
<meta name="theme-color" content="#2f6b2a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">
<style>
:root{
  --leaf:#2f6b2a; --sun:#ffd23f; --sun-edge:#d99a0b; --ink:#3a2410;
  --panel:rgba(255,248,225,.94); --panel-ink:#3a2410;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){ --panel:rgba(28,44,24,.94); --panel-ink:#f6edd2; }
}
:root[data-theme="dark"]{ --panel:rgba(28,44,24,.94); --panel-ink:#f6edd2; }
html,body{height:100%;margin:0;}
body{background:var(--leaf);overflow:hidden;font-family:ui-rounded,'SF Pro Rounded','Trebuchet MS',system-ui,sans-serif;
  touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}

#eggs{position:fixed;left:calc(14px + env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px));
  background:var(--panel);color:var(--panel-ink);font-weight:700;font-size:26px;padding:8px 18px;border-radius:999px;
  box-shadow:0 4px 0 rgba(0,0,0,.25);display:flex;gap:4px;}
#eggs span{opacity:.22;filter:grayscale(1);transition:opacity .3s}
#eggs span.got{opacity:1;filter:none}
#eggs.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.3)}}

.btn{border:none;border-radius:22px;background:var(--sun);color:var(--ink);font-size:38px;font-family:inherit;font-weight:700;
  box-shadow:0 6px 0 var(--sun-edge);cursor:pointer;touch-action:none;display:flex;align-items:center;justify-content:center;padding:0;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--sun-edge);}
.btn:focus-visible{outline:4px solid #fff;outline-offset:3px;}

#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(20,40,15,.45);}
#overlay[hidden]{display:none}
.card{background:var(--panel);color:var(--panel-ink);border-radius:32px;padding:28px 34px;text-align:center;max-width:min(88vw,440px);
  box-shadow:0 10px 0 rgba(0,0,0,.25);}
.card h1{margin:0 0 6px;font-size:52px;line-height:1.05}
.card p{margin:0 0 20px;font-size:22px;line-height:1.35;font-weight:500}
.card .big{font-size:64px;line-height:1.1;margin:0 0 16px}
.species{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:0 0 16px}
.sp{width:84px;height:80px;border-radius:20px;border:4px solid transparent;background:rgba(116,195,76,.35);cursor:pointer;padding:0}
.sp canvas{position:static;width:100%;height:100%}
.sp.sel{border-color:var(--panel-ink);background:rgba(116,195,76,.7)}
.swatches{display:flex;gap:14px;justify-content:center;margin:0 0 20px}
.sw{width:58px;height:58px;border-radius:50%;border:5px solid transparent;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.25);padding:0}
.sw.sel{border-color:#fff;outline:4px solid var(--panel-ink);transform:scale(1.1)}
.modes{display:flex;gap:10px;justify-content:center;margin:0 0 12px}
.mode-btn{padding:8px 20px;border-radius:20px;border:3px solid transparent;background:rgba(116,195,76,.35);cursor:pointer;font-size:19px;font-family:inherit;font-weight:700;color:var(--panel-ink);}
.mode-btn.sel{border-color:var(--panel-ink);background:rgba(116,195,76,.7)}
.maps{display:flex;gap:10px;justify-content:center;margin:0 0 14px}
.mp{width:90px;height:64px;border-radius:16px;border:4px solid transparent;background:rgba(116,195,76,.35);cursor:pointer;padding:0;font-size:32px;display:flex;align-items:center;justify-content:center;}
.mp.sel{border-color:var(--panel-ink);background:rgba(116,195,76,.7)}
.card .btn{width:auto;height:auto;padding:10px 46px;font-size:56px;margin:0 auto}
#total-score{font-size:18px;font-weight:600;opacity:.55;margin:-10px 0 12px;}
@media (max-width:520px){
  #roar{width:110px;height:110px;font-size:54px}
}
@media (prefers-reduced-motion:reduce){#eggs.pop{animation:none}}
#menu-btn{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));bottom:calc(30px + env(safe-area-inset-bottom,0px));
  width:72px;height:72px;border-radius:50%;font-size:36px;border:none;background:var(--panel);color:var(--panel-ink);
  box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;display:none;align-items:center;justify-content:center;
  touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
#menu-btn.vis{display:flex;}
#menu-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
#mute-btn{position:fixed;right:calc(22px + env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px));
  width:62px;height:62px;border-radius:50%;font-size:26px;border:none;background:var(--panel);color:var(--panel-ink);
  box-shadow:0 4px 0 rgba(0,0,0,.25);cursor:pointer;display:none;align-items:center;justify-content:center;
  touch-action:none;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;}
#mute-btn.vis{display:flex;}
#mute-btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25);}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="eggs" aria-label="Eggs found"></div>
<button id="menu-btn" aria-label="Menu">🏠</button>
<button id="mute-btn" aria-label="Mute">🔊</button>

<div id="overlay">
  <div class="card">
    <h1 id="ovTitle">Dino Jungle</h1>
    <div class="big" id="ovText">🦖 🥚</div>
    <div id="total-score"></div>
    <div class="modes" id="modes"><button class="mode-btn sel" data-mode="eggs">🥚 Eggs</button><button class="mode-btn" data-mode="parade">🎺 Parade</button></div>
    <div class="maps" id="maps" aria-label="Pick a map"></div>
    <div class="species" id="species" aria-label="Pick a dinosaur"></div>
    <div class="swatches" id="swatches" aria-label="Dino colour"></div>
    <button class="btn" id="ovBtn" aria-label="Play">▶</button>
  </div>
</div>

<script>
(() => {
const cv = document.getElementById('game'); let ctx = cv.getContext('2d');
let VW, VH, Z;
function resize(){
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  VW = innerWidth; VH = innerHeight;
  cv.width = VW * dpr; cv.height = VH * dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
  Z = Math.max(0.6, Math.min(1.3, Math.min(VW, VH) / 650));
  cv._dpr = dpr;
}
addEventListener('resize', resize); resize();

// ---------- world ----------
let seed = 11;
const rnd = () => (seed = (seed * 16807) % 2147483647, (seed - 1) / 2147483646);
const W = 4800, H = 3600, START = {x:2000, y:1500}, EGG_COUNT = 10;
const ponds = [
  {x:950, y:1550,rx:240,ry:150},{x:2350,y:1750,rx:290,ry:175},{x:2550,y:550,rx:180,ry:115},
  {x:520, y:2050,rx:150,ry:95}, {x:1750,y:480, rx:140,ry:90},
  {x:3800,y:700, rx:200,ry:125},{x:4300,y:2000,rx:260,ry:165},
  {x:3500,y:3200,rx:200,ry:125},{x:1000,y:3000,rx:230,ry:145},{x:700,y:3400,rx:165,ry:105},
];
const volcanoes = [
  {type:'volcano', x:650,  y:760,  r:165},
  {type:'volcano', x:2900, y:320,  r:150},
  {type:'volcano', x:200,  y:1850, r:155},
  {type:'volcano', x:2750, y:1820, r:160},
  {type:'volcano', x:4300, y:1100, r:155},
  {type:'volcano', x:1500, y:3300, r:150},
];
const inWater = (x,y,m) => ponds.some(p => { const dx=(x-p.x)/(p.rx+m), dy=(y-p.y)/(p.ry+m); return dx*dx+dy*dy < 1; });

const trees=[], rocks=[], bushes=[], solids=volcanoes.map(v => ({x:v.x, y:v.y-30, r:v.r}));
const free = (x,y,m) => !inWater(x,y,m) && Math.hypot(x-START.x,y-START.y) > 150 && solids.every(o => Math.hypot(x-o.x,y-o.y) > o.r + m);
const addTree = (x,y) => { const t={type:'tree',x,y,r:24,s:0.85+rnd()*0.45,h:rnd()}; trees.push(t); solids.push(t); };
for (let x=0; x<=W; x+=75){ addTree(x+rnd()*25, 15+rnd()*15); addTree(x+rnd()*25, H-15-rnd()*15); }
for (let y=80; y<=H-80; y+=75){ addTree(15+rnd()*15, y+rnd()*25); addTree(W-15-rnd()*15, y+rnd()*25); }
for (let i=0;i<270;i++){ const x=80+rnd()*(W-160), y=80+rnd()*(H-160); if (free(x,y,45)) addTree(x,y); }
for (let i=0;i<70;i++){ const x=80+rnd()*(W-160), y=80+rnd()*(H-160); if (free(x,y,30)){ const r={type:'rock',x,y,r:16+rnd()*12,h:rnd()}; rocks.push(r); solids.push(r);} }
for (let i=0;i<230;i++){ const x=60+rnd()*(W-120), y=60+rnd()*(H-120); if(!inWater(x,y,20)) bushes.push({type:'bush',x,y,s:0.7+rnd()*0.6,h:rnd()}); }

let eggs = [];
function placeEggs(){
  eggs=[];
  const ePN=Math.ceil(EGG_COUNT/NESTS.length);
  NESTS.forEach((nest,ni)=>{
    let placed=0,tries=0;
    while(placed<ePN&&tries++<2000){
      const a=Math.random()*Math.PI*2,d=50+Math.random()*130;
      const x=nest.x+Math.cos(a)*d, y=nest.y+Math.sin(a)*d;
      if(free(x,y,25)&&eggs.every(e=>Math.hypot(e.x-x,e.y-y)>55)){
        eggs.push({type:'egg',x,y,nestId:ni,c:['#ff9ecb','#8fd3ff','#ffd56b','#c7a0ff'][eggs.length%4],w:Math.random()*6});
        placed++;
      }
    }
  });
}

// ---------- map themes ----------
const MAPS = {
  jungle:{label:'Jungle',icon:'🌴',
    bg:'#1f5a22',groundFill:'#74c34c',blobA:'rgba(40,110,30,.10)',blobB:'rgba(200,240,120,.10)',
    trail:'rgba(196,150,90,.55)',clearing:'rgba(196,150,90,.55)',grassColor:'#4f9a33',
    flowerColors:['#fff','#ffe14d','#ff7eb6','#b78bff','#ff8a4d'],
    pondSand:'#e3c98d',pondWaterA:'#5cc8e8',pondWaterB:'#2e8fc0',lilyColor:'#4caf50',lilyFlower:'#ffc2dd',
    trunkColor:'#7a4e2a',leafA:['#1f6b2a','#2e8a35','#45a845'],leafB:['#22702f','#378f2e','#5bb53b'],fruitColor:'#ff5a4e',
    rockA:'#8c8f94',rockB:'#b3b6bb',bushA:'#3c9a3a',bushB:'#2f8a43',bushTop:'#52b04a',bushTopB:'#45a656',
    foods:['🍎','🍌','🍇','🥥','🍓','🍉']},
  ice:{label:'Ice Kingdom',icon:'❄️',
    bg:'#0d1f38',groundFill:'#c8dff0',blobA:'rgba(180,210,240,.15)',blobB:'rgba(255,255,255,.12)',
    trail:'rgba(150,190,230,.65)',clearing:'rgba(150,190,230,.55)',grassColor:'#8ab8d8',
    flowerColors:['#fff','#c8e8ff','#a8d8f8','#e0f0ff'],
    pondSand:'#a8c8e8',pondWaterA:'#eaf6ff',pondWaterB:'#b8d8f0',lilyColor:'#c0e8ff',lilyFlower:'#ffffff',
    trunkColor:'#4a6888',leafA:['#c8e4f8','#d8ecff','#e8f4ff'],leafB:['#b8daf4','#c8e4ff','#daeeff'],fruitColor:'#a8d0f8',
    rockA:'#7898b8',rockB:'#a8c8e0',bushA:'#b0d4f0',bushB:'#98c4e8',bushTop:'#c8e0f8',bushTopB:'#d8ecff',
    foods:['🐟','🫐','🍦','⭐','🪨','🧊']},
  candy:{label:'Candy Land',icon:'🍭',
    bg:'#2a0840',groundFill:'#f4c8f0',blobA:'rgba(255,140,220,.12)',blobB:'rgba(255,240,160,.10)',
    trail:'rgba(255,200,80,.6)',clearing:'rgba(255,200,80,.55)',grassColor:'#e060c0',
    flowerColors:['#ff80c0','#ff4488','#ffe060','#80ffff','#c080ff','#fff'],
    pondSand:'#ffb8e8',pondWaterA:'#ff80cc',pondWaterB:'#ee40a8',lilyColor:'#ff60b0',lilyFlower:'#ffffff',
    trunkColor:'#e84080',leafA:['#ff90d0','#ff60b8','#ff40a0'],leafB:['#c060e8','#a040cc','#d080f8'],fruitColor:'#ffee40',
    rockA:'#c080e8',rockB:'#d8a8f8',bushA:'#ff80c0',bushB:'#e860a8',bushTop:'#ff90cc',bushTopB:'#ee70b8',
    foods:['🍭','🍬','🍰','🧁','🍩','🍫']},
  desert:{label:'Desert',icon:'🏜️',
    bg:'#7a3a0a',groundFill:'#e8c870',blobA:'rgba(200,150,60,.15)',blobB:'rgba(255,210,100,.10)',
    trail:'rgba(160,100,40,.6)',clearing:'rgba(160,100,40,.55)',grassColor:'#b8903a',
    flowerColors:['#ff6b35','#ff4040','#ffaa00','#ff8c00','#ffe060'],
    pondSand:'#c8a050',pondWaterA:'#6ab8d0',pondWaterB:'#3a7090',lilyColor:'#90c860',lilyFlower:'#ffee44',
    trunkColor:'#5a3010',leafA:['#3a7020','#2e6015','#4a8a25'],leafB:['#507a20','#3e6815','#5e9228'],fruitColor:'#ff5500',
    rockA:'#c8a040',rockB:'#dfc060',bushA:'#6a8028',bushB:'#568022',bushTop:'#78a030',bushTopB:'#649228',
    foods:['🌵','🍊','🍯','🥜','🫐','🍇']},
};
let mapName = 'jungle';
try { const sm=localStorage.getItem('dinoMap'); if(MAPS[sm]) mapName=sm; } catch(e){}

// ---------- pre-rendered ground ----------
const ground = document.createElement('canvas');
function buildGround(){
  const M=MAPS[mapName]; ground.width=W; ground.height=H;
  const g=ground.getContext('2d');
  g.fillStyle=M.groundFill; g.fillRect(0,0,W,H);
  for (let i=0;i<800;i++){ g.fillStyle=Math.random()<.5?M.blobA:M.blobB;
    g.beginPath(); g.arc(Math.random()*W,Math.random()*H,40+Math.random()*110,0,7); g.fill(); }
  g.strokeStyle=M.trail; g.lineCap='round'; g.lineWidth=46;
  [[1100,1900],[2900,2000],[3500,800],[700,2500],[1000,1000],
   [2000,3000],[2400,700],[3900,1600],[300,1500],
   [4500,1000],[4600,2600],[4400,3400],[3200,3500],[1200,3400],[500,3100]].forEach(([tx,ty]) => {
    g.beginPath(); g.moveTo(START.x,START.y);
    g.quadraticCurveTo((START.x+tx)/2+(Math.random()-.5)*400,(START.y+ty)/2+(Math.random()-.5)*400,tx,ty); g.stroke(); });
  g.fillStyle=M.clearing; g.beginPath(); g.ellipse(START.x,START.y,120,85,0,0,7); g.fill();
  g.strokeStyle=M.grassColor; g.lineWidth=2.5;
  for (let i=0;i<5300;i++){ const x=Math.random()*W,y=Math.random()*H; g.beginPath();
    g.moveTo(x-4,y); g.lineTo(x-6,y-9); g.moveTo(x,y); g.lineTo(x,y-11); g.moveTo(x+4,y); g.lineTo(x+6,y-9); g.stroke(); }
  const fc=M.flowerColors;
  for (let i=0;i<620;i++){ const x=Math.random()*W,y=Math.random()*H; if(inWater(x,y,25)) continue;
    g.fillStyle=fc[(Math.random()*fc.length)|0];
    for (let k=0;k<5;k++){ const a=k*1.2566; g.beginPath(); g.arc(x+Math.cos(a)*4,y+Math.sin(a)*4,3.2,0,7); g.fill(); }
    g.fillStyle='#ffb300'; g.beginPath(); g.arc(x,y,2.4,0,7); g.fill(); }
  ponds.forEach(p => {
    // wide sandy shore
    g.fillStyle=M.pondSand; g.beginPath(); g.ellipse(p.x,p.y,p.rx+24,p.ry+20,0,0,7); g.fill();
    // mud ring
    g.fillStyle='rgba(0,0,0,.07)'; g.beginPath(); g.ellipse(p.x,p.y,p.rx+10,p.ry+8,0,0,7); g.fill();
    // deep water gradient
    const gr=g.createRadialGradient(p.x-p.rx*.25,p.y-p.ry*.25,p.rx*.08,p.x,p.y,p.rx*1.05);
    gr.addColorStop(0,M.pondWaterA); gr.addColorStop(.55,M.pondWaterB); gr.addColorStop(1,'rgba(0,20,50,.55)');
    g.fillStyle=gr; g.beginPath(); g.ellipse(p.x,p.y,p.rx,p.ry,0,0,7); g.fill();
    // surface highlight streak
    g.fillStyle='rgba(255,255,255,.18)'; g.beginPath(); g.ellipse(p.x-p.rx*.28,p.y-p.ry*.28,p.rx*.28,p.ry*.1,-.3,0,7); g.fill();
    // shore rocks
    for(let k=0;k<6;k++){ const a=k*1.047+.3, rx=p.x+Math.cos(a)*(p.rx+6), ry=p.y+Math.sin(a)*(p.ry+5);
      g.fillStyle='rgba(120,100,80,.5)'; g.beginPath(); g.ellipse(rx,ry,6+Math.random()*5,4,Math.random()*.8,0,7); g.fill(); }
    // lily pads
    for(let k=0;k<7;k++){ const a=Math.random()*7,d=.5*Math.random()+.15,lx=p.x+Math.cos(a)*p.rx*d,ly=p.y+Math.sin(a)*p.ry*d;
      g.fillStyle=M.lilyColor; g.beginPath(); g.moveTo(lx,ly); g.arc(lx,ly,14,0.4,6); g.closePath(); g.fill();
      g.fillStyle='rgba(0,0,0,.1)'; g.beginPath(); g.moveTo(lx,ly); g.lineTo(lx+14,ly); g.stroke();
      if(Math.random()<.55){ g.fillStyle=M.lilyFlower; g.beginPath(); g.arc(lx+3,ly-2,5,0,7); g.fill(); } }
  });
}
buildGround();

// ---------- dino ----------
const dino = {type:'dino', x:START.x, y:START.y, dir:1, walk:0, moving:false, roar:0, blink:0, s:1, celebrate:0};
const playerBaby = {type:'dino', x:START.x-70, y:START.y+20, dir:1, walk:0, moving:false, roar:0, blink:0, s:.52};
const SPEED = 200;
const STEP_PITCH = {rex:1,trike:.9,steg:.85,brachi:.55,unicorn:1.3,para:1,anky:.75,ptero:1.7};
let stepCooldown = 0;
const vibrate = p => { try{navigator.vibrate(p);}catch(e){} };
let muted = false;
let weatherTimer=25+Math.random()*25, weatherActive=0;
let shakeTimer=0, shakeAmt=0, zoomPulse=0;
let powerCooldown=0, lastTapTime=0;
let playMode='eggs', paradeMembers=[], playerTrail=[], paradeComplete=false;
const NESTS=[{x:1400,y:900},{x:3400,y:1400},{x:900,y:2800},{x:3600,y:1100}];
const SKINS = {
  blue:   {G:'#3d8bfd', DG:'#2563c9', BEL:'#c4e2ff', SP:'#ffd23f'},
  purple: {G:'#9b5de5', DG:'#6c3bb0', BEL:'#e8d8ff', SP:'#ffd23f'},
  red:    {G:'#e8453c', DG:'#a9271f', BEL:'#ffd3c8', SP:'#ffd23f'},
  orange: {G:'#ff8c2e', DG:'#c95f12', BEL:'#ffe2bd', SP:'#7a3cc2'},
};
let skinName = 'blue';
try { const saved = localStorage.getItem('dinoSkin'); if (SKINS[saved]) skinName = saved; } catch(e){}
const mapWrap = document.getElementById('maps');
function drawMapPicker(){
  mapWrap.innerHTML = Object.keys(MAPS).map(k=>`<button class="mp${k===mapName?' sel':''}" data-map="${k}" aria-label="${MAPS[k].label}">${MAPS[k].icon}</button>`).join('');
}
mapWrap.addEventListener('click', e => {
  const b=e.target.closest('[data-map]'); if(!b) return;
  mapName=b.dataset.map; try{localStorage.setItem('dinoMap',mapName);}catch(e){}
  drawMapPicker(); buildGround(); playing=false; stopMusic();
});
const swWrap = document.getElementById('swatches');
function drawSwatches(){
  swWrap.innerHTML = Object.keys(SKINS).map(k => `<button class="sw${k===skinName?' sel':''}" data-skin="${k}" aria-label="${k}" style="background:${SKINS[k].G}"></button>`).join('');
}
swWrap.addEventListener('click', e => { const b = e.target.closest('[data-skin]'); if (!b) return;
  skinName = b.dataset.skin; try { localStorage.setItem('dinoSkin', skinName); } catch(e){} drawSwatches(); drawPicker(); dino.roar = .6; });
const blocked = (x,y,skipWater=false) => x<40||y<40||x>W-40||y>H-40||(!skipWater&&inWater(x,y,8))||
  solids.some(o => Math.hypot(x-o.x, y-o.y) < (o.type==='tree' ? 14 : o.r) + 16);

// ---------- input ----------
const held = {up:0,down:0,left:0,right:0};

// ---------- sound ----------
let ac = null;
const audio = () => { try { if (!ac) ac = new (window.AudioContext||window.webkitAudioContext)(); if (ac.state==='suspended') ac.resume(); } catch(e){} return ac; };
// Roar = growling voice (rough sawtooth with pitch rise-and-fall) + breathy throat noise,
// shaped through mouth-like formant filters, lightly distorted, with a jungle echo.
let fx = null, lastRoar = 0;
function roarFX(a){
  if (fx) return fx;
  const out = a.createGain(); out.gain.value = .8; out.connect(a.destination);
  const comp = a.createDynamicsCompressor(); comp.threshold.value = -18; comp.ratio.value = 6; comp.connect(out);
  const len = a.sampleRate * 2.2, ir = a.createBuffer(2, len, a.sampleRate);
  for (let c=0;c<2;c++){ const d=ir.getChannelData(c); for (let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3); }
  const verb = a.createConvolver(); verb.buffer = ir;
  const wet = a.createGain(); wet.gain.value = .35; verb.connect(wet); wet.connect(comp);
  const n = 1024, curve = new Float32Array(n);
  for (let i=0;i<n;i++){ const x=i/(n-1)*2-1; curve[i]=Math.tanh(x*3.5); }
  const shaper = a.createWaveShaper(); shaper.curve = curve; shaper.oversample = '4x';
  const bus = a.createGain(); bus.connect(shaper); shaper.connect(comp); shaper.connect(verb);
  const noise = a.createBuffer(1, a.sampleRate*2, a.sampleRate), nd = noise.getChannelData(0);
  for (let i=0;i<nd.length;i++) nd[i] = Math.random()*2-1;
  return fx = {bus, noise};
}
function roar(){
  dino.roar = 1; playerBaby.roar = .6; vibrate([40,20,40]);
  const a = audio(); if (!a) return;
  if (a.currentTime - lastRoar < .4) return; lastRoar = a.currentTime;
  playRoar(SPECIES[speciesName].pitch, 1);
  const et=a.currentTime+.28;
  if(speciesName==='unicorn'){ [880,1100,1320].forEach((f,i)=>{ const ti=et+i*.1,o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.value=f; g.gain.setValueAtTime(.13,ti); g.gain.exponentialRampToValueAtTime(.001,ti+.35); o.connect(g); g.connect(a.destination); o.start(ti); o.stop(ti+.4); }); }
  if(speciesName==='ptero'){ const o=a.createOscillator(),g=a.createGain(); o.type='triangle'; o.frequency.setValueAtTime(1900,et); o.frequency.linearRampToValueAtTime(650,et+.55); g.gain.setValueAtTime(.18,et); g.gain.exponentialRampToValueAtTime(.001,et+.65); o.connect(g); g.connect(a.destination); o.start(et); o.stop(et+.7); }
  if(speciesName==='brachi'){ const o=a.createOscillator(),g=a.createGain(); o.type='sine'; o.frequency.setValueAtTime(32,et); o.frequency.exponentialRampToValueAtTime(18,et+.9); g.gain.setValueAtTime(.22,et); g.gain.exponentialRampToValueAtTime(.001,et+1.3); o.connect(g); g.connect(a.destination); o.start(et); o.stop(et+1.4); }
  if(speciesName==='anky'){ const o=a.createOscillator(),g=a.createGain(); o.type='sawtooth'; o.frequency.setValueAtTime(55,et); o.frequency.exponentialRampToValueAtTime(28,et+.6); g.gain.setValueAtTime(.18,et); g.gain.exponentialRampToValueAtTime(.001,et+.9); o.connect(g); g.connect(a.destination); o.start(et); o.stop(et+1); }
  npcs.forEach(n => { if (n.cool <= 0 && Math.hypot(n.x-dino.x, n.y-dino.y) < 420){ n.cool = 2.5; n.reply = .5 + Math.random()*.6; } });
}
function playRoar(pitch, vol){
  if(muted) return; const a = audio(); if (!a) return;
  const {bus, noise} = roarFX(a);
  const t = a.currentTime + .01, D = 1.5, p = (.85 + Math.random()*.3) * pitch;   // every roar slightly different
  const nodes = [];
  const env = a.createGain();
  env.gain.setValueAtTime(.0001,t); env.gain.exponentialRampToValueAtTime(.9*vol,t+.18);
  env.gain.setValueAtTime(.9*vol,t+.7); env.gain.exponentialRampToValueAtTime(.0001,t+D);
  env.connect(bus);
  // mouth shape: opens wide ("aaah") then closes ("ooww")
  const filt = (type,q,fs,g) => { const f=a.createBiquadFilter(); f.type=type; f.Q.value=q;
    f.frequency.setValueAtTime(fs[0]*p,t); f.frequency.linearRampToValueAtTime(fs[1]*p,t+.35); f.frequency.linearRampToValueAtTime(fs[2]*p,t+D);
    const gn=a.createGain(); gn.gain.value=g; f.connect(gn); gn.connect(env); return f; };
  const throat = a.createGain();
  throat.connect(filt('bandpass',3,[450,750,380],.9));
  throat.connect(filt('bandpass',4,[1100,1300,700],.5));
  throat.connect(filt('lowpass',.7,[260,300,200],1.1));
  // rough, rattly voice: the volume flutters ~25 times a second
  const rough = a.createGain(); rough.gain.value = .6; rough.connect(throat);
  const flutter = a.createOscillator(); flutter.type='square';
  flutter.frequency.setValueAtTime(22,t); flutter.frequency.linearRampToValueAtTime(32,t+.4); flutter.frequency.linearRampToValueAtTime(18,t+D);
  const fg = a.createGain(); fg.gain.value = .4; flutter.connect(fg); fg.connect(rough.gain); nodes.push(flutter);
  const wobble = a.createOscillator(); wobble.frequency.value = 6;
  const wg = a.createGain(); wg.gain.value = 35; wobble.connect(wg); nodes.push(wobble);
  [[1,'sawtooth',.5],[1.013,'sawtooth',.4],[.5,'sine',.8]].forEach(([m,type,g]) => {
    const o=a.createOscillator(); o.type=type;
    o.frequency.setValueAtTime(70*p*m,t); o.frequency.exponentialRampToValueAtTime(130*p*m,t+.3);
    o.frequency.exponentialRampToValueAtTime(95*p*m,t+.8); o.frequency.exponentialRampToValueAtTime(45*p*m,t+D);
    wg.connect(o.detune);
    const og=a.createGain(); og.gain.value=g; o.connect(og); og.connect(rough); nodes.push(o); });
  // breath
  const br = a.createBufferSource(); br.buffer = noise;
  const bg = a.createGain(); bg.gain.value = .55; br.connect(bg); bg.connect(throat); nodes.push(br);
  nodes.forEach(n => { n.start(t); n.stop(t+D+.1); });
}
function chime(){
  if(muted) return; const a = audio(); if (!a) return;
  [660, 880, 1320].forEach((f,i) => { const t=a.currentTime+i*.09, o=a.createOscillator(), gn=a.createGain();
    o.type='triangle'; o.frequency.value=f; gn.gain.setValueAtTime(.25,t); gn.gain.exponentialRampToValueAtTime(.0001,t+.35);
    o.connect(gn); gn.connect(a.destination); o.start(t); o.stop(t+.4); });
}

// ---------- food ----------
const foods = [];
function munch(){
  if(muted) return; const a=audio(); if(!a) return;
  [640,900].forEach((f,i)=>{ const t=a.currentTime+i*.04, o=a.createOscillator(), g=a.createGain();
    o.type='sine'; o.frequency.value=f; g.gain.setValueAtTime(.12,t); g.gain.exponentialRampToValueAtTime(.001,t+.07);
    o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+.09); });
}
function erupt(v){
  const a=audio(); if(!a) return;
  v.erupting=2.5; vibrate([80,40,200,40,300]);
  ['sawtooth','sine'].forEach((type,i)=>{ const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(38+i*18,a.currentTime); o.frequency.exponentialRampToValueAtTime(18+i*8,a.currentTime+2);
    g.gain.setValueAtTime(.28-i*.06,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+2.8);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+3); });
  for(let k=0;k<70;k++) sparks.push({x:v.x+(Math.random()-.5)*44,y:v.y-232,vx:(Math.random()-.5)*280,vy:-160-Math.random()*380,life:2,c:['#ff4400','#ff8800','#ffcc00','#ff2200','#ff6600'][k%5]});
}
function triggerPower(){
  powerCooldown=5; vibrate([50,20,100]); const a=audio();
  const burst=(c,n=30)=>{ for(let k=0;k<n;k++) sparks.push({x:dino.x+(Math.random()-.5)*60,y:dino.y-40,vx:(Math.random()-.5)*280,vy:-120-Math.random()*200,life:1.2,c}); };
  if(speciesName==='rex'){
    shakeTimer=.7; shakeAmt=14;
    for(let k=0;k<25;k++) sparks.push({x:dino.x+(Math.random()-.5)*220,y:dino.y+5,vx:(Math.random()-.5)*120,vy:-60-Math.random()*80,life:.9,c:'#8B4513'});
    npcs.forEach(n=>{n.sleepTimer=0; if(Math.hypot(n.x-dino.x,n.y-dino.y)<380){n.roar=.7; n.goal=null;}});
    if(eggs.length){let ne=null,nd=1e9; eggs.forEach(e=>{const d=Math.hypot(e.x-dino.x,e.y-dino.y);if(d<nd){nd=d;ne=e;}}); if(ne)ne.pulse=2.5;}
    if(a&&!muted){const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(55,a.currentTime);o.frequency.exponentialRampToValueAtTime(18,a.currentTime+.5);g.gain.setValueAtTime(.3,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.9);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+1);}
  } else if(speciesName==='unicorn'){
    for(let k=0;k<70;k++) sparks.push({x:dino.x,y:dino.y-30,vx:Math.cos(k/70*Math.PI*2)*220,vy:Math.sin(k/70*Math.PI*2)*220-60,life:1.3,c:['#ff9ecb','#8fd3ff','#ffd56b','#c7a0ff','#ff6b6b','#6bffb0'][k%6]});
    foods.forEach(f=>{f.eaten=false;f.respawnIn=0;});
    if(a&&!muted){[880,1100,1320,1760].forEach((f,i)=>{const ti=a.currentTime+i*.09,o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.value=f;g.gain.setValueAtTime(.14,ti);g.gain.exponentialRampToValueAtTime(.001,ti+.4);o.connect(g);g.connect(a.destination);o.start(ti);o.stop(ti+.45);});}
  } else if(speciesName==='ptero'){
    zoomPulse=2; burst('#c8e8ff',20);
    if(a&&!muted){const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(1900,a.currentTime);o.frequency.linearRampToValueAtTime(420,a.currentTime+.65);g.gain.setValueAtTime(.16,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.75);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.8);}
  } else if(speciesName==='brachi'){
    if(eggs.length){let s=[...eggs].sort((a,b)=>Math.hypot(a.x-dino.x,a.y-dino.y)-Math.hypot(b.x-dino.x,b.y-dino.y));s.slice(0,2).forEach(e=>e.pulse=3);}
    burst(SKINS[skinName].G,28);
    if(a&&!muted){const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(26,a.currentTime);o.frequency.exponentialRampToValueAtTime(12,a.currentTime+.9);g.gain.setValueAtTime(.24,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+1.3);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+1.5);}
  } else if(speciesName==='para'){
    npcs.forEach(n=>{n.sleepTimer=0;n.roar=.6;n.reply=.4+Math.random()*.4;});
    for(let k=0;k<28;k++) sparks.push({x:dino.x,y:dino.y-60,vx:Math.cos(k/28*Math.PI*2)*140,vy:Math.sin(k/28*Math.PI*2)*140,life:1.1,c:'#ffd56b'});
    if(a&&!muted){[240,320,280,380].forEach((f,i)=>{const ti=a.currentTime+i*.13,o=a.createOscillator(),g=a.createGain();o.type='square';o.frequency.value=f;g.gain.setValueAtTime(.11,ti);g.gain.exponentialRampToValueAtTime(.001,ti+.3);o.connect(g);g.connect(a.destination);o.start(ti);o.stop(ti+.35);});}
  } else if(speciesName==='anky'){
    shakeTimer=.5; shakeAmt=10;
    for(let k=0;k<30;k++) sparks.push({x:dino.x+(Math.random()-.5)*180,y:dino.y+5,vx:(Math.random()-.5)*100,vy:-50-Math.random()*60,life:.8,c:SKINS[skinName].rockA||'#c080e8'});
    if(a&&!muted){const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.setValueAtTime(45,a.currentTime);o.frequency.exponentialRampToValueAtTime(20,a.currentTime+.4);g.gain.setValueAtTime(.22,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.7);o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.8);}
  } else { burst(SKINS[skinName].G,25); }
}
function footstep(pitch=1){
  if(muted) return; const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain();
  o.type='sine'; o.frequency.setValueAtTime(85*pitch,a.currentTime); o.frequency.exponentialRampToValueAtTime(28*pitch,a.currentTime+.09);
  g.gain.setValueAtTime(.13,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.11);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+.13);
}
function placeFoods(){
  foods.length=0;
  const emojis=MAPS[mapName].foods; let tries=0;
  while(foods.length<28 && tries++<4000){
    const x=120+Math.random()*(W-240), y=120+Math.random()*(H-240);
    if(free(x,y,22) && foods.every(f=>Math.hypot(f.x-x,f.y-y)>120))
      foods.push({type:'food',x,y,emoji:emojis[Math.floor(Math.random()*emojis.length)],eaten:false,respawnIn:0,bob:Math.random()*7});
  }
}
function drawFood(f,t){
  if(f.eaten) return;
  const fl=Math.sin(t*2.2+f.bob)*3;
  ctx.save(); ctx.globalAlpha=.92; ctx.font='28px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(f.emoji,f.x,f.y-14+fl); ctx.restore(); ctx.globalAlpha=1;
}

const MUSIC = {

  stopMusic(); if(muted) return; const a=audio(); if(!a) return;
  const {seq,tempo,type}=MUSIC[mapName]||MUSIC.jungle; let idx=0;
  const note=()=>{ const f=seq[idx++%seq.length]; const o=a.createOscillator(),g=a.createGain();

// ---------- ambients ----------
const ambients=[];
function updateAmbients(dt,t){
  const wi=Math.min(1,weatherActive/4);
  if(weatherActive>0&&ambients.length<180){
    if(mapName==='jungle') for(let i=0;i<4;i++){if(Math.random()<dt*55*wi) ambients.push({type:'rain',x:Math.random()*VW,y:-5,vx:30,vy:520+Math.random()*180,life:.3});}
    else if(mapName==='ice') for(let i=0;i<3;i++){if(Math.random()<dt*35*wi) ambients.push({type:'snow',x:Math.random()*VW,y:-12,vx:(Math.random()-.5)*40-20,vy:55+Math.random()*40,r:2+Math.random()*3,life:.9});}
    else if(mapName==='candy'){if(Math.random()<dt*22*wi) ambients.push({type:'star',x:Math.random()*VW,y:Math.random()*VH*.4,vx:(Math.random()-.5)*30,vy:25+Math.random()*30,life:1.4,c:['#ff80c0','#ffee60','#80ffff','#c080ff','#fff'][Math.random()*5|0]});}
    else if(mapName==='desert') for(let i=0;i<6;i++){if(Math.random()<dt*50*wi) ambients.push({type:'sand',x:-10,y:VH*(.25+Math.random()*.55),vx:85+Math.random()*65,vy:(Math.random()-.5)*12,life:.8,r:1.5+Math.random()*2});}
  }
  if(mapName==='ice'&&Math.random()<dt*14) ambients.push({type:'snow',x:Math.random()*VW,y:-12,vx:(Math.random()-.5)*14,vy:28+Math.random()*22,r:2+Math.random()*3,life:1.2});
  else if(mapName==='candy'&&Math.random()<dt*9) ambients.push({type:'star',x:Math.random()*VW,y:VH*(.1+Math.random()*.8),vx:(Math.random()-.5)*18,vy:-22-Math.random()*18,life:1.6,c:['#ff80c0','#ffee60','#80ffff','#c080ff','#fff'][Math.random()*5|0]});
  else if(mapName==='jungle'&&Math.random()<dt*3) ambients.push({type:'firefly',x:Math.random()*VW,y:VH*(.15+Math.random()*.65),vx:(Math.random()-.5)*18,vy:(Math.random()-.5)*10,life:3+Math.random()*2,ph:Math.random()*7});
  for(let i=ambients.length-1;i>=0;i--){ const a=ambients[i]; a.x+=a.vx*dt; a.y+=a.vy*dt; a.life-=dt; if(a.life<=0||a.y>VH+20||a.x<-20||a.x>VW+20) ambients.splice(i,1); }
}
function drawAmbients(t){
  ambients.forEach(a=>{
    ctx.globalAlpha=Math.min(1,a.life*.8);
    if(a.type==='snow'){ ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(a.x,a.y,a.r,0,7); ctx.fill(); }
    else if(a.type==='star'){ ctx.fillStyle=a.c; ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillText('✦',a.x,a.y); }
    else if(a.type==='firefly'){ const g=(Math.sin(t*3+a.ph)+1)/2; ctx.globalAlpha=Math.min(1,a.life*.5)*g*.8; ctx.fillStyle='#ffff80'; ctx.beginPath(); ctx.arc(a.x,a.y,2.5+g*2,0,7); ctx.fill(); }
    else if(a.type==='rain'){ ctx.strokeStyle='rgba(100,150,255,.55)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(a.x-7,a.y-16); ctx.stroke(); }
    else if(a.type==='sand'){ ctx.fillStyle=`rgba(200,160,60,${.35*al})`; ctx.beginPath(); ctx.ellipse(a.x,a.y,a.r||2,1,0,0,7); ctx.fill(); }
  });
  ctx.globalAlpha=1;
}

const ell = (x,y,rx,ry,c) => { ctx.fillStyle=c; ctx.beginPath(); ctx.ellipse(x,y,rx,ry,0,0,7); ctx.fill(); };
function drawCactus(t){
  const s=t.s, G=MAPS[mapName].leafA[0];
  ell(t.x,t.y+3,15*s,6*s,'rgba(0,0,0,.2)');
  const hides=dino.y<t.y&&t.y-dino.y<130*s&&Math.abs(dino.x-t.x)<70*s;
  if(hides) ctx.globalAlpha=.4;
  ctx.fillStyle=G;
  // trunk
  ctx.fillRect(t.x-6*s,t.y-62*s,12*s,64*s); ell(t.x,t.y-62*s,6*s,6*s,G);
  // left arm
  ctx.fillRect(t.x-22*s,t.y-44*s,17*s,9*s); ell(t.x-22*s,t.y-44*s,7*s,9*s,G);
  ctx.fillRect(t.x-29*s,t.y-56*s,9*s,16*s); ell(t.x-25*s,t.y-56*s,6*s,6*s,G);
  // right arm
  ctx.fillRect(t.x+5*s,t.y-38*s,18*s,9*s); ell(t.x+23*s,t.y-38*s,7*s,9*s,G);
  ctx.fillRect(t.x+20*s,t.y-50*s,9*s,16*s); ell(t.x+24*s,t.y-50*s,6*s,6*s,G);
  // highlight
  ctx.fillStyle='rgba(255,255,255,.18)'; ctx.fillRect(t.x-2*s,t.y-60*s,3*s,56*s);
  if(t.h>.65) ell(t.x,t.y-70*s,7*s,5*s,MAPS[mapName].fruitColor);
  ctx.globalAlpha=1;
}
function drawTree(t){
  if(mapName==='desert'){ drawCactus(t); return; }
  const M=MAPS[mapName], s=t.s;
  ell(t.x,t.y+3,34*s,11*s,'rgba(0,0,0,.2)');
  const hides = dino.y < t.y && t.y - dino.y < 130*s && Math.abs(dino.x - t.x) < 70*s;
  if (hides) ctx.globalAlpha = .4;
  // root flare
  ctx.fillStyle=M.trunkColor; ctx.beginPath(); ctx.ellipse(t.x,t.y,11*s,5*s,0,Math.PI,Math.PI*2); ctx.fill();
  // tapered trunk
  ctx.beginPath(); ctx.moveTo(t.x-9*s,t.y-1*s); ctx.lineTo(t.x+9*s,t.y-1*s); ctx.lineTo(t.x+5*s,t.y-42*s); ctx.lineTo(t.x-5*s,t.y-42*s); ctx.fill();
  // trunk highlight
  ctx.fillStyle='rgba(255,255,255,.14)'; ctx.beginPath(); ctx.moveTo(t.x-2*s,t.y-3*s); ctx.lineTo(t.x+3*s,t.y-3*s); ctx.lineTo(t.x+1*s,t.y-40*s); ctx.lineTo(t.x-2*s,t.y-40*s); ctx.fill();

  ctx.fillStyle='rgba(0,0,0,.13)'; ctx.beginPath(); ctx.moveTo(t.x+3*s,t.y-3*s); ctx.lineTo(t.x+9*s,t.y-1*s); ctx.lineTo(t.x+5*s,t.y-42*s); ctx.lineTo(t.x+1*s,t.y-40*s); ctx.fill();
  const greens = t.h<.5 ? M.leafA : M.leafB;
  // canopy — 5 overlapping organic blobs
  ell(t.x-4*s, t.y-60*s, 46*s, 36*s, greens[0]);
  ell(t.x-22*s, t.y-70*s, 32*s, 28*s, greens[1]);
  ell(t.x+20*s, t.y-74*s, 32*s, 27*s, greens[1]);
  ell(t.x-6*s,  t.y-90*s, 30*s, 24*s, greens[2]);
  ell(t.x+12*s, t.y-67*s, 22*s, 19*s, greens[2]);

  ell(t.x-16*s, t.y-78*s, 13*s, 9*s, 'rgba(255,255,255,.16)');

  ell(t.x+4*s, t.y-55*s, 28*s, 10*s, 'rgba(0,0,0,.1)');

  ctx.globalAlpha = 1;
}
function drawRock(r){

  ell(r.x, r.y+3, r.r*1.25, r.r*.45, 'rgba(0,0,0,.2)');
  // main mass
  ctx.fillStyle=M.rockA; ctx.beginPath(); ctx.ellipse(r.x-r.r*.08,r.y-r.r*.35,r.r*1.05,r.r*.78,-.18,0,7); ctx.fill();

}

function drawEgg(e,t){
  if(e.pulse>0){ const pg=Math.min(1,e.pulse/3); ctx.strokeStyle=`rgba(255,240,100,${pg*.8})`; ctx.lineWidth=4+pg*3; ctx.beginPath(); ctx.ellipse(e.x,e.y-18,28+pg*18,22+pg*14,0,0,7); ctx.stroke(); }
  const wob = Math.sin(t*3+e.w)*.12;
  ell(e.x,e.y+2,16,5,'rgba(0,0,0,.2)');
  ctx.save(); ctx.translate(e.x,e.y); ctx.rotate(wob);
  ell(0,-18,14,19,'#fff6e0');
  ctx.fillStyle=e.c; [[-5,-24,4],[6,-14,3.5],[-3,-8,3],[5,-28,2.5]].forEach(([x,y,r]) => { ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.fill(); });
  ctx.restore();
  const tw = (Math.sin(t*4+e.w)+1)/2;

}

function stepToward(n, gx, gy, speed, dt){

      drawSlots(); eggLabel.classList.remove('pop'); void eggLabel.offsetWidth; eggLabel.classList.add('pop');
      if (!eggs.length){ target=null;
        for(let k=0;k<180;k++) sparks.push({x:dino.x+(Math.random()-.5)*60,y:dino.y-60,vx:(Math.random()-.5)*900,vy:-100-Math.random()*800,life:2.2,c:['#ff9ecb','#8fd3ff','#ffd56b','#c7a0ff','#ff6b6b','#6bffb0','#fff'][k%7]});
        for(let k=0;k<24;k++) sparks.push({heart:true,x:dino.x+(Math.random()-.5)*100,y:dino.y-50,vx:(Math.random()-.5)*120,vy:-120-Math.random()*120,life:2.5});
        roar(); setTimeout(() => { ovTitle.textContent='Yay!'; ovText.textContent='🎉 🦖 🎉'; overlay.hidden=false; menuBtn.classList.remove('vis'); muteBtn.classList.remove('vis'); }, 1400); }
    } }
  // food eating
  foods.forEach(f => {
    if(f.eaten){ f.respawnIn-=dt; if(f.respawnIn<=0) f.eaten=false; return; }
    if(Math.hypot(dino.x-f.x,dino.y-f.y)<42){ f.eaten=true; f.respawnIn=9+Math.random()*6; munch(); vibrate([20]);
      for(let k=0;k<10;k++) sparks.push({x:f.x+(Math.random()-.5)*20,y:f.y-14,vx:(Math.random()-.5)*70,vy:-55-Math.random()*50,life:.8,c:['#ffff80','#ff80c0','#80ffff'][k%3]}); }
  });
  npcs.forEach(n => updateNPC(n, dt));
  flies.forEach(f => { f.a += dt*(.6+Math.sin(t+f.x)*.4); f.x += Math.cos(f.a)*40*dt; f.y += Math.sin(f.a*1.3)*30*dt;
    f.x=(f.x+W)%W; f.y=(f.y+H)%H; });
  for (let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.x+=s.vx*dt; s.y+=s.vy*dt; s.vy+=(s.heart?-30:500)*dt; s.life-=dt*(s.heart?.8:1.4); if (s.life<=0) sparks.splice(i,1); }
  volcanoes.forEach(v=>{ if(v.erupting>0) v.erupting=Math.max(0,v.erupting-dt); });
  updateAmbients(dt,t);

  // camera
  const Zf=Z*(1-zoomPulse*.28); Zcam=Zf;
  const shX=shakeTimer>0?(Math.random()-.5)*shakeAmt:0, shY=shakeTimer>0?(Math.random()-.5)*shakeAmt*.5:0;
  const vw=VW/Zf, vh=VH/Zf;
  camX = vw>=W ? (W-vw)/2 : Math.max(0,Math.min(W-vw, dino.x-vw/2));
  camY = vh>=H ? (H-vh)/2 : Math.max(0,Math.min(H-vh, dino.y-50-vh/2));
  const dpr = cv._dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0); ctx.fillStyle=MAPS[mapName].bg; ctx.fillRect(0,0,VW,VH);
  ctx.setTransform(dpr*Zf,0,0,dpr*Zf,(-camX+shX)*dpr*Zf,(-camY+shY)*dpr*Zf);
  ctx.drawImage(ground,0,0);

  // water shimmer
  ctx.strokeStyle='rgba(255,255,255,.35)'; ctx.lineWidth=2;
  ponds.forEach((p,i) => { for (let k=0;k<3;k++){ const ph=(t*.5+k/3+i*.2)%1; ctx.globalAlpha=1-ph;
    ctx.beginPath(); ctx.ellipse(p.x+Math.cos(i+k)*p.rx*.3, p.y+Math.sin(i*2+k)*p.ry*.3, 10+ph*30, 4+ph*12, 0,0,7); ctx.stroke(); } });
  ctx.globalAlpha=1;

  // nest markers
  if(playMode==='eggs') NESTS.forEach((n,i)=>{ const hasEggs=eggs.some(e=>e.nestId===i); ctx.strokeStyle=hasEggs?'rgba(255,220,80,.5)':'rgba(255,220,80,.18)'; ctx.lineWidth=3; ctx.setLineDash([10,8]); ctx.beginPath(); ctx.ellipse(n.x,n.y,95,65,0,0,7); ctx.stroke(); ctx.setLineDash([]); });
  // depth-sorted objects in view
  const pad=140, vis = o => o.x>camX-pad && o.x<camX+vw+pad && o.y>camY-pad && o.y<camY+vh+pad*1.5;
  const list = [...trees,...rocks,...bushes,...eggs,...foods,...npcs,...volcanoes,playerBaby,dino].filter(o => o.type==='volcano' ? Math.abs(o.x-camX-vw/2) < vw/2+260 && o.y>camY-60 && o.y<camY+vh+320 : vis(o)).sort((a,b)=>a.y-b.y);
  for (const o of list){
    if (o.type==='tree') drawTree(o); else if (o.type==='rock') drawRock(o);
    else if (o.type==='bush') drawBush(o); else if (o.type==='egg') drawEgg(o,t); else if (o.type==='food') drawFood(o,t); else if (o.type==='volcano') drawVolcano(o,t); else drawDino(o,t);
  }
  if (target){ const r=14+Math.sin(t*8)*4; ctx.strokeStyle='rgba(255,255,255,.8)'; ctx.lineWidth=4;
    ctx.beginPath(); ctx.ellipse(target.x,target.y,r,r*.5,0,0,7); ctx.stroke(); }
  drawRoarText(dino);
  sparks.forEach(s => { ctx.globalAlpha=Math.min(1,s.life);
    if (s.heart){ ctx.font='28px sans-serif'; ctx.textAlign='center'; ctx.fillText('💛',s.x,s.y); } else ell(s.x,s.y,4,4,s.c); }); ctx.globalAlpha=1;
  flies.filter(vis).forEach(f => drawFly(f,t));
  npcs.filter(n=>n.sleepTimer>10&&vis(n)).forEach(n=>{
    const yb=n.y-SPECIES[n.kind].top*n.s-8;
    ['z','Z'].forEach((z,i)=>{ const bob=Math.abs(Math.sin(t*.9+i))*.6+.3;
      ctx.save(); ctx.globalAlpha=bob; ctx.font=`bold ${Math.round((13+i*5)*n.s)}px ui-rounded,system-ui`; ctx.textAlign='center';
      ctx.fillStyle='#aaddff'; ctx.fillText(z,n.x+(9+i*11)*n.s,yb-i*14*n.s-Math.sin(t*.7+i)*5); ctx.restore(); ctx.globalAlpha=1; }); });
  npcs.filter(n=>n.nameTimer>0&&vis(n)).forEach(n=>{
    const al=Math.min(1,n.nameTimer), yy=n.y-SPECIES[n.kind].top*n.s-16;
    ctx.save(); ctx.globalAlpha=al; ctx.font=`bold ${Math.round(16*n.s)}px ui-rounded,system-ui`; ctx.textAlign='center';
    ctx.lineWidth=4; ctx.strokeStyle='rgba(0,0,0,.55)'; ctx.fillStyle='#fff';
    ctx.strokeText(SPECIES[n.kind].label,n.x,yy); ctx.fillText(SPECIES[n.kind].label,n.x,yy); ctx.restore(); ctx.globalAlpha=1; });

  // hint arrow to nearest egg
  if (playing && eggs.length){
    let n=null, nd=1e9; eggs.forEach(e => { const dd=Math.hypot(e.x-dino.x,e.y-dino.y); if (dd<nd){nd=dd;n=e;} });
    if (nd > 260){ const a=Math.atan2(n.y-dino.y, n.x-dino.x), ax=dino.x+Math.cos(a)*80, ay=dino.y-35+Math.sin(a)*80;
      ctx.save(); ctx.translate(ax,ay); ctx.rotate(a); ctx.globalAlpha=.55+Math.sin(t*5)*.25;
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.moveTo(16,0); ctx.lineTo(-8,-11); ctx.lineTo(-3,0); ctx.lineTo(-8,11); ctx.closePath(); ctx.fill(); ctx.restore(); }
  }
  ctx.setTransform(dpr,0,0,dpr,0,0);
  drawAmbients(t);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
<script>
if ('serviceWorker' in navigator) addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
</script>
</body>
